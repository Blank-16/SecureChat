services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=securechat
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=securechat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ./server
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://securechat:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/securechat
      - CLIENT_ORIGIN=https://localhost
      - ALLOWED_ORIGINS=https://localhost
      - SESSION_TTL_DAYS=30
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/
        - VITE_WS_URL=/
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
