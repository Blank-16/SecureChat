services:
  server:
    build:
      context: ./server
    environment:
      - PORT=4000
      - DB_PATH=/app/data/chat.db
      - CLIENT_ORIGIN=https://localhost
      - SESSION_TTL_DAYS=30
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/
        - VITE_WS_URL=/
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - client
    restart: unless-stopped

volumes:
  server-data:
